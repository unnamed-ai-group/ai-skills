name: Problem or test failure
description: Report incorrect, unsafe, inaccessible, or inconsistent behaviour
title: "Problem: "
labels: []
body:
  - type: input
    id: skill
    attributes:
      label: Skill
      description: Which skill or file is affected?
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task and expected result
      description: What were you trying to do, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What happened? Remove all private and identifying information.
    validations:
      required: true
  - type: input
    id: product
    attributes:
      label: AI product and model
      description: Include the version or date if known.
  - type: textarea
    id: impact
    attributes:
      label: Accessibility or safety impact
      description: Describe the barrier or risk without disclosing information you want to keep private.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private transcripts, medical information, personal information, and confidential client information.
          required: true
